apiVersion: apps/v1
kind: Deployment
metadata:
  name: novalux-feedback-loop-manager
  namespace: novalux-system
  labels:
    app: novalux-feedback-loop-manager
    component: core-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: novalux-feedback-loop-manager
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: novalux-feedback-loop-manager
        component: core-engine
    spec:
      containers:
      - name: feedback-loop-manager
        image: novalux/feedback-loop-manager:v1.0.0
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-headless.novalux-data.svc.cluster.local:9092"
        - name: ELASTICSEARCH_HOSTS
          value: "elasticsearch-master.novalux-data.svc.cluster.local:9200"
        - name: AI_MODEL_SERVER_URL
          value: "http://ai-model-server.novalux-ai.svc.cluster.local:8000"
        - name: OPTIMIZATION_INTERVAL_SECONDS
          value: "60"
        - name: MAX_CONCURRENT_OPTIMIZATIONS
          value: "5"
        - name: FEEDBACK_WINDOW_MINUTES
          value: "30"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
        volumeMounts:
        - name: config-volume
          mountPath: /etc/novalux
      volumes:
      - name: config-volume
        configMap:
          name: novalux-feedback-loop-manager-config
---
apiVersion: v1
kind: Service
metadata:
  name: novalux-feedback-loop-manager
  namespace: novalux-system
  labels:
    app: novalux-feedback-loop-manager
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: http
    name: http
  - port: 9090
    targetPort: metrics
    name: metrics
  selector:
    app: novalux-feedback-loop-manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: novalux-feedback-loop-manager-config
  namespace: novalux-system
data:
  feedback-loop-manager.yaml: |
    server:
      port: 8080
      metrics-port: 9090
      shutdown-timeout: 30s
    
    telemetry:
      enabled: true
      sampling-rate: 0.1
      trace-export-interval: 5s
    
    feedback-loop:
      optimization-interval: 60s
      max-concurrent-optimizations: 5
      feedback-window: 30m
      optimization-threshold: 0.05
      cooldown-period: 5m
      max-adjustment-percentage: 20
      
      components:
        - name: "player-behavior-analyzer"
          type: "ai-model"
          enabled: true
          update-frequency: "hourly"
          metrics:
            - "engagement-score"
            - "retention-probability"
            - "monetization-propensity"
          
        - name: "game-balance-optimizer"
          type: "parameter-tuning"
          enabled: true
          update-frequency: "daily"
          parameters:
            - name: "difficulty-curve"
              min: 0.5
              max: 1.5
              step: 0.05
            - name: "reward-frequency"
              min: 0.8
              max: 1.2
              step: 0.05
            - name: "progression-speed"
              min: 0.7
              max: 1.3
              step: 0.1
          
        - name: "content-recommendation-engine"
          type: "ai-model"
          enabled: true
          update-frequency: "hourly"
          metrics:
            - "click-through-rate"
            - "time-spent"
            - "conversion-rate"
          
        - name: "responsible-gaming-monitor"
          type: "rule-based"
          enabled: true
          update-frequency: "continuous"
          rules:
            - name: "session-length-limit"
              threshold: 120
              unit: "minutes"
            - name: "loss-percentage-limit"
              threshold: 20
              unit: "percent"
            - name: "rapid-transaction-limit"
              threshold: 5
              unit: "count"
              time-window: 10
              time-unit: "minutes"
    
    kafka:
      bootstrap-servers: "kafka-headless.novalux-data.svc.cluster.local:9092"
      consumer-group: "feedback-loop-manager"
      topics:
        input:
          - "player-metrics"
          - "game-metrics"
          - "system-aggregates"
          - "anomaly-events"
        output:
          optimization-events: "optimization-events"
          model-update-requests: "model-update-requests"
          parameter-adjustments: "parameter-adjustments"
          rg-interventions: "rg-interventions"
    
    elasticsearch:
      hosts: "elasticsearch-master.novalux-data.svc.cluster.local:9200"
      indices:
        optimization-history:
          name: "optimization-history"
          retention-days: 90
        feedback-metrics:
          name: "feedback-metrics"
          retention-days: 30
    
    ai-model-server:
      url: "http://ai-model-server.novalux-ai.svc.cluster.local:8000"
      timeout: 500ms
      retry-attempts: 3
      retry-delay: 100ms
      batch-size: 32
    
    monitoring:
      metrics-interval: 15s
      health-check-interval: 5s
      alert-thresholds:
        optimization-failure-rate: 0.05
        model-update-latency-ms: 1000
        parameter-adjustment-impact-min: 0.02
