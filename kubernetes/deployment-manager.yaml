apiVersion: apps/v1
kind: Deployment
metadata:
  name: novalux-deployment-manager
  namespace: novalux-system
  labels:
    app: novalux-deployment-manager
    component: core-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: novalux-deployment-manager
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: novalux-deployment-manager
        component: core-engine
    spec:
      serviceAccountName: novalux-deployment-manager
      containers:
      - name: deployment-manager
        image: novalux/deployment-manager:v1.0.0
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "0.5"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-headless.novalux-data.svc.cluster.local:9092"
        - name: ELASTICSEARCH_HOSTS
          value: "elasticsearch-master.novalux-data.svc.cluster.local:9200"
        - name: DEPLOYMENT_STRATEGY
          value: "canary"
        - name: CANARY_PERCENTAGE
          value: "10"
        - name: ROLLOUT_INTERVAL_MINUTES
          value: "15"
        - name: MAX_DEPLOYMENT_TIME_MINUTES
          value: "60"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
        volumeMounts:
        - name: config-volume
          mountPath: /etc/novalux
      volumes:
      - name: config-volume
        configMap:
          name: novalux-deployment-manager-config
---
apiVersion: v1
kind: Service
metadata:
  name: novalux-deployment-manager
  namespace: novalux-system
  labels:
    app: novalux-deployment-manager
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: http
    name: http
  - port: 9090
    targetPort: metrics
    name: metrics
  selector:
    app: novalux-deployment-manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: novalux-deployment-manager-config
  namespace: novalux-system
data:
  deployment-manager.yaml: |
    server:
      port: 8080
      metrics-port: 9090
      shutdown-timeout: 30s
    
    telemetry:
      enabled: true
      sampling-rate: 0.1
      trace-export-interval: 5s
    
    deployment:
      strategy: "canary"
      canary-percentage: 10
      rollout-interval-minutes: 15
      max-deployment-time-minutes: 60
      auto-rollback: true
      verification-metrics:
        - name: "error-rate"
          threshold: 0.01
          comparison: "less-than"
        - name: "latency-p95-ms"
          threshold: 500
          comparison: "less-than"
        - name: "success-rate"
          threshold: 0.99
          comparison: "greater-than"
      
      components:
        - name: "adaptive-core"
          namespace: "novalux-system"
          deployment-name: "novalux-adaptive-core"
          required-services:
            - "kafka"
            - "elasticsearch"
          verification-period-minutes: 10
          
        - name: "feedback-loop-manager"
          namespace: "novalux-system"
          deployment-name: "novalux-feedback-loop-manager"
          required-services:
            - "kafka"
            - "elasticsearch"
            - "adaptive-core"
          verification-period-minutes: 10
          
        - name: "data-ingestion"
          namespace: "novalux-data"
          deployment-name: "novalux-data-ingestion"
          required-services:
            - "kafka"
            - "schema-registry"
          verification-period-minutes: 5
          
        - name: "stream-processor"
          namespace: "novalux-data"
          deployment-name: "novalux-stream-processor"
          required-services:
            - "kafka"
            - "elasticsearch"
          verification-period-minutes: 5
    
    kafka:
      bootstrap-servers: "kafka-headless.novalux-data.svc.cluster.local:9092"
      consumer-group: "deployment-manager"
      topics:
        input:
          - "optimization-events"
          - "system-status"
        output:
          deployment-events: "deployment-events"
          deployment-status: "deployment-status"
    
    elasticsearch:
      hosts: "elasticsearch-master.novalux-data.svc.cluster.local:9200"
      indices:
        deployment-history:
          name: "deployment-history"
          retention-days: 90
    
    monitoring:
      metrics-interval: 15s
      health-check-interval: 5s
      alert-thresholds:
        deployment-failure-count: 2
        verification-timeout-minutes: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: novalux-deployment-manager
  namespace: novalux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: novalux-deployment-manager
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: novalux-deployment-manager
subjects:
- kind: ServiceAccount
  name: novalux-deployment-manager
  namespace: novalux-system
roleRef:
  kind: ClusterRole
  name: novalux-deployment-manager
  apiGroup: rbac.authorization.k8s.io
